apiVersion: v1
kind: Secret
metadata:
  name: llmops-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "llmops.labels" . | nindent 4 }}
type: Opaque
data:
  GRAFANA_USER: {{ .Values.grafana.adminUser | b64enc | quote }}
  GRAFANA_PASSWORD: {{ .Values.grafana.adminPassword | b64enc | quote }}
