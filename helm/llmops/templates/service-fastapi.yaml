apiVersion: v1
kind: Service
metadata:
  name: llmops-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "llmops.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    app: llmops-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
