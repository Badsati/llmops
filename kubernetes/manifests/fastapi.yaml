apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmops-api
  namespace: llmops
  labels:
    app.kubernetes.io/name: llmops
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llmops-api
  template:
    metadata:
      labels:
        app: llmops-api
        app.kubernetes.io/name: llmops
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: llmops-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: llmops-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: llmops-api
  namespace: llmops
  labels:
    app.kubernetes.io/name: llmops
    app.kubernetes.io/component: api
spec:
  selector:
    app: llmops-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
