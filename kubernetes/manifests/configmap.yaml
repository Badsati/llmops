apiVersion: v1
kind: ConfigMap
metadata:
  name: llmops-config
  namespace: llmops
  labels:
    app.kubernetes.io/name: llmops
data:
  OLLAMA_HOST: "http://ollama:11434"
  OLLAMA_MODEL: "qwen2.5:3b"
  EMBEDDING_MODEL: "nomic-embed-text"
  CHROMA_HOST: "chromadb"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "documents"
  RAG_CHUNK_SIZE: "1000"
  RAG_CHUNK_OVERLAP: "200"
  RAG_TOP_K: "4"
  LOG_LEVEL: "INFO"
