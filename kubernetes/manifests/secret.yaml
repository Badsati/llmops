apiVersion: v1
kind: Secret
metadata:
  name: llmops-secrets
  namespace: llmops
  labels:
    app.kubernetes.io/name: llmops
type: Opaque
# Values are base64-encoded. Replace with your own secrets before deploying.
# echo -n 'admin'    | base64  → YWRtaW4=
# echo -n 'changeme' | base64  → Y2hhbmdlbWU=
data:
  GRAFANA_USER: YWRtaW4=
  GRAFANA_PASSWORD: Y2hhbmdlbWU=
